services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  product-api:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB: productdb
    depends_on:
      - mongodb

volumes:
  mongo_data: